<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JUANSELED — Herramientas Técnicas Profesionales</title>
<meta name="theme-color" content="#DC2626">
<style>
:root{--rojo:#DC2626;--negro:#1E293B;--tinta:#334155;--gris:#64748B;--linea:#E2E8F0;--fondo:#F1F5F9;--azul:#0E9DE5}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--fondo);color:var(--tinta);font-size:14px;line-height:1.5}
header{background:var(--rojo);color:#fff;text-align:center;padding:26px 16px;border-radius:0 0 22px 22px}
header h1{font-size:26px;font-weight:800;letter-spacing:.5px}
header p{font-size:13px;opacity:.92;margin-top:4px}
.banner{background:var(--azul);color:#fff;text-align:center;font-size:12.5px;font-weight:600;padding:7px 12px;margin:14px 16px 0;border-radius:999px;max-width:640px}
main{max-width:680px;margin:0 auto;padding:18px 16px 40px}
.tool{display:block;background:#fff;border:1px solid var(--linea);border-radius:18px;padding:16px 18px;margin-bottom:12px;text-decoration:none;color:inherit;transition:transform .1s, box-shadow .1s}
.tool:active{transform:scale(.985)}
.tool:hover{box-shadow:0 4px 14px rgba(30,41,59,.08)}
.tool .top{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.tool h2{font-size:15.5px;font-weight:700;color:var(--negro)}
.tag{font-size:10px;font-weight:700;letter-spacing:.5px;padding:2.5px 9px;border-radius:999px;background:var(--fondo);color:var(--gris);text-transform:uppercase}
.tag.nuevo{background:var(--rojo);color:#fff}
.tool p{font-size:12.5px;color:var(--gris)}
.tool .go{margin-top:8px;font-size:12.5px;font-weight:700;color:var(--rojo)}
footer{background:var(--negro);color:#cbd5e1;text-align:center;padding:22px 16px;border-radius:22px;margin:8px 16px 24px;max-width:648px;font-size:12.5px}
footer .t{font-size:16px;font-weight:800;color:#fff}
footer .t span{color:var(--rojo)}
footer a{color:#fff;text-decoration:none}
@media(min-width:700px){.banner,footer{margin-left:auto;margin-right:auto}}
</style>
</head>
<body>

<header>
  <h1>⚡ JUANSELED — TÉCNICA ⚡</h1>
  <p>Herramientas Técnicas Profesionales para montajes LED</p>
</header>

<div class="banner">🇦🇷 Buenos Aires · Disponible en LATAM</div>

<main id="lista"></main>

<footer>
  <div class="t">JUANSELED<span>-TÉCNICA</span></div>
  <p>Juanseled Servicios Técnicos</p>
  <p><a href="https://www.juanseled.com">www.juanseled.com</a></p>
</footer>

<script>
// ==== HERRAMIENTAS: agregá o editá acá, una línea por app ====
const TOOLS = [
  {
    nombre: 'Instalación de Pantallas LED',
    desc: 'Calculadora eléctrica y de datos: circuitos, térmicas, fases, puertos Gigabit, croquis, materiales y memoria técnica en PDF. Funciona offline.',
    url: 'instalacion-pantallas-led.html',
    tag: 'NUEVO'
  },
  {
    nombre: 'La Navaja Suiza — NovaStar Sales Hub',
    desc: '60 productos NovaStar en 10 categorías: buscador, comparador, wizard de recomendación y favoritos.',
    url: 'https://sunoftiger.github.io/juanseled-tecnica/',
    tag: 'Catálogo'
  }
];
// =============================================================

document.getElementById('lista').innerHTML = TOOLS.map(t => `
  <a class="tool" href="${t.url}">
    <div class="top"><h2>${t.nombre}</h2><span class="tag ${t.tag==='NUEVO'?'nuevo':''}">${t.tag}</span></div>
    <p>${t.desc}</p>
    <div class="go">Abrir →</div>
  </a>`).join('');
</script>
</body>
</html>
